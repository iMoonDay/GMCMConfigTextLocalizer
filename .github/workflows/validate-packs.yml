name: Validate and publish translation packs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pack paths and JSON
        run: python3 .github/validate-packs.py
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: community-packs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish the packs directory
        run: |
          python3 .github/validate-packs.py
          packs_commit=$(git subtree split --prefix=packs)
          git push origin "$packs_commit:refs/heads/community-packs"
